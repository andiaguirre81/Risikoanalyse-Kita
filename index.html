<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073e78"><title>Kita-RisikoCheck – Andreas Aguirre</title><link rel="icon" href="favicon.svg"><style>
:root{--navy:#073e78;--blue:#35a8e5;--bg:#f3f7fb;--line:#d9e5ef;--ink:#18354d;--muted:#536a7d;--red:#b83b3b;--yellow:#936500;--green:#16764a}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--navy)}.shell{max-width:1100px;margin:auto;padding:20px}.head{background:white;border-bottom:4px solid var(--blue)}.brand{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand img{width:min(100%,430px);height:auto;display:block}.brand .mark{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:800}.mark img{width:46px;height:46px}.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}h1{color:var(--navy);font-size:clamp(1.9rem,4.5vw,3rem);line-height:1.14;margin:.4em 0}h2{color:var(--navy);margin:0 0 12px;font-size:1.45rem}h3{color:var(--navy);margin:0 0 8px;font-size:1.12rem}.lead{font-size:1.12rem;color:var(--muted);max-width:790px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;margin:16px 0;box-shadow:0 4px 14px #103e6610}.hero{padding:34px}.notice{border-left:5px solid var(--blue);background:#eaf5fd;padding:15px 18px;border-radius:9px;margin:20px 0}.notice.important{border-color:#e1a133;background:#fff8e8}.small{font-size:.89rem;color:var(--muted)}.muted{color:var(--muted)}.btn{border:0;border-radius:10px;padding:12px 18px;background:var(--navy);color:white;font-weight:700;min-height:46px}.btn:hover{filter:brightness(1.12)}.btn.secondary{background:#e7f2fb;color:var(--navy)}.btn.danger{background:#fff0ef;color:#992e2e}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:block;font-weight:650;font-size:.93rem}.field input,.field select,.field textarea{display:block;width:100%;border:1px solid #b9ccdb;background:white;border-radius:9px;padding:11px;color:var(--ink);margin-top:5px;font-weight:400}.field textarea{min-height:85px;resize:vertical}.full{grid-column:1/-1}.check{display:flex;align-items:flex-start;gap:9px;margin:8px 0;font-weight:450}.check input{width:19px;height:19px;flex-shrink:0;accent-color:var(--navy);margin-top:3px}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.nav{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0}.nav button{border:1px solid var(--line);background:white;color:var(--navy);border-radius:999px;padding:9px 14px;font-weight:650}.nav button[aria-current="step"]{background:var(--navy);color:white}.stephead{margin:22px 0}.stephead p{color:var(--muted)}.risk{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:15px;background:#f9fcff}.risk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.risk select{border-left:5px solid #a7b5c1}.risk select.low{border-left-color:#23915d}.risk select.medium{border-left-color:#e0ad30}.risk select.high{border-left-color:#d44b4b}.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:.8rem;font-weight:750;background:#e7edf3;color:#46596c}.pill.low{background:#d9f4e5;color:#12603d}.pill.medium{background:#fff0bd;color:#735000}.pill.high{background:#ffe1e1;color:#a52727}.result{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:25px;font-family:Georgia,serif;line-height:1.65;max-height:640px;overflow:auto}.footer{text-align:center;padding:24px 0 40px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:18px 0}.tagline{font-weight:600;color:var(--blue)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hidden{display:none!important}.status{font-size:.88rem;color:var(--muted)}@media(max-width:650px){.shell{padding:13px}.card{padding:16px}.hero{padding:22px}.grid,.risk-grid,.checks{grid-template-columns:1fr}.btn{width:100%}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{border-radius:9px}.brand img{max-width:340px}.actions{flex-direction:column}}@media print{body{background:white;color:black}.head,.nav,.actions,.footer,.no-print,.stephead{display:none!important}.shell{max-width:none;padding:0}#app>*:not(#printArea){display:none!important}#printArea{display:block!important}.result{border:0;max-height:none;overflow:visible;padding:0;white-space:pre-wrap;font-size:11pt}.notice{border:1px solid #777;background:white}.card{box-shadow:none;border:0;padding:0}}
.group-row{padding:15px;border:1px solid var(--line);border-radius:12px;margin:12px 0;background:#f8fbff}.room-card summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;list-style:none}.room-card summary::-webkit-details-marker{display:none}.room-fields{margin:20px 0}.extra{padding:12px;background:#f5f9fd;border-radius:10px;margin:14px 0}.extra summary{cursor:pointer;font-weight:700}.extra .grid{margin-top:12px}@media(max-width:650px){.group-row{padding:12px}.room-card{padding:15px}.room-card summary{align-items:flex-start}}

.report{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px;line-height:1.4}.report-head h1{font-size:1.6rem}.report h2{margin:22px 0 9px;font-size:1.16rem;border-bottom:2px solid var(--line);padding-bottom:5px}.report-note{font-size:.82rem;border:1px solid #b5b5b5;padding:10px}.report-item{border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin:9px 0;break-inside:avoid;page-break-inside:avoid;font-size:.9rem}.report-item p{margin:5px 0}.report-item-head{display:flex;justify-content:space-between;gap:12px}.note-lines{font-size:.8rem;margin-top:9px}.note-lines div{height:22px;border-bottom:1px solid #aaa}.todo-table{width:100%;border-collapse:collapse;font-size:.83rem}.todo-table th,.todo-table td{border:1px solid #b6c5d1;padding:7px;vertical-align:top}.todo-table th{background:#eef4f8}.open-fields{font-size:.85rem}.report-note p{margin:5px 0}@media print{@page{size:A4;margin:13mm}.report{padding:0;border:0;font-size:9pt}.report-item{padding:8px;margin:7px 0;font-size:8.5pt}.report h2{font-size:12pt}.report-head h1{font-size:16pt}.todo-table{font-size:8pt}.todo-table thead{display:table-header-group}.report-note{font-size:8pt}.note-lines div{height:18px}}
</style></head><body><header class="head"><div class="shell brand"><a href="https://www.andreas-aguirre.de" target="_blank" rel="noopener" aria-label="Andreas Aguirre – Website"><img src="logo.jpeg" alt="Andreas Aguirre – Coaching für Kitas und Familienzentren"></a><div class="mark"><img src="favicon.svg" alt=""><span>Kita-RisikoCheck</span></div></div></header><main class="shell"><nav class="nav no-print" id="nav" aria-label="Arbeitsschritte"></nav><div id="app"></div></main><footer class="footer no-print"><a href="https://www.andreas-aguirre.de" target="_blank" rel="noopener">Andreas Aguirre – Coaching für Kitas &amp; Familienzentren</a><div class="small">Lokal im Browser · Keine Speicherung · Keine Übertragung von Eingaben</div></footer><script>
'use strict';
const DISCLAIMER='Diese Anwendung dient ausschließlich als erste strukturierte Bewertungsgrundlage. Sie ersetzt keine fachliche Gefährdungseinschätzung, keine individuelle Kinderschutzprüfung und keine gemeinsame Bewertung durch die verantwortlichen Fachkräfte und die Einrichtungsleitung. Alle Risikoeinstufungen sind vorläufig und müssen anhand der tatsächlichen Bedingungen vor Ort fachlich überprüft werden.';
const STEPS=['Start','Einrichtung','Räume','Personen','Pädagogik','Auswertung'];
const ROOM_TYPES=['Gruppenraum','Nebenraum','Schlafraum','Waschraum','Pflegebereich','Therapieraum','Bewegungsraum','Flur','Treppenhaus','Außengelände','Rückzugsbereich','Küche','Personalraum','Büro','Mehrzweckraum','Lager','Sonstiger Raum'];
const PERSONS=['Pädagogische Fachkräfte','Ergänzungskräfte','Kita-Assistenzen und Inklusionshilfen','Externe Therapeutinnen und Therapeuten','Frühförderkräfte','Praktikantinnen und Praktikanten','Ehrenamtliche','Eltern und Besucher','Sonstige externe Personen'];
const PERSON_QUESTIONS=['Eins-zu-eins-Situationen sind geregelt','Einarbeitung externer Personen ist geregelt','Kinderschutzkonzept und Verhaltensampel sind bekannt','Verbindliche Zuständigkeiten sind festgelegt','Aufenthaltsorte und Übergaben werden dokumentiert','Nähe und Distanz sind verbindlich geregelt','Beschwerdemöglichkeiten sind vorhanden','Überforderung wird erkannt und reflektiert','Melde- und Dokumentationswege sind verbindlich'];
const THEMES=[
['Teiloffene und offene Arbeit',['Transparente Aufenthaltsübersicht','Absprachen zwischen Gruppen','Situationsangemessene Aufsicht','Regelmäßige Überprüfung der Raumnutzung']],
['Aufsichtspflicht und Raumwechsel',['Verbindliche Übergaberegeln','Angepasste Aufsicht nach Situation','Klare Zuständigkeiten bei Etagenwechseln']],
['Pflege und Intimsphäre',['Wahrung der Intimsphäre','Pflegerische Handlungen werden angekündigt','Grenzen und nonverbale Signale werden beachtet','Keine abgeschlossenen Pflegeräume']],
['Schlaf- und Ruhesituationen',['Verbindliche Aufsicht und Kontrollen','Rückzugswünsche werden respektiert','Schlafräume sind organisatorisch zugeordnet']],
['Therapeutische Einzelsettings',['An- und Abmeldung externer Fachkräfte','Transparente Übergaben','Aufenthaltsorte sind bekannt','Beschwerdesignale werden wahrgenommen']],
['Kita-Assistenzen und intensive Begleitung',['Strukturierte Einarbeitung','Fachliche Begleitung durch Kita-Team','Verhaltensampel ist bekannt','Aufgaben und Grenzen sind geklärt']],
['Herausforderndes Verhalten',['Frühzeitige Deeskalation','Co-Regulation','Fallreflexion','Anpassung von Anforderungen und Reizen']],
['Konflikte und Übergriffe zwischen Kindern',['Grenzverletzungen werden aufgegriffen','Betroffene Kinder werden geschützt','Vorfälle werden nachbereitet','Kinder können Beschwerden äußern']],
['Körperliche Interventionen in akuten Gefährdungssituationen',['Deeskalation und mildere Mittel haben Vorrang','Rechtliche Voraussetzungen werden geprüft','Verhältnismäßigkeit und Dauer werden beachtet','Vorfälle werden dokumentiert und reflektiert','Meldepflichten werden einzelfallbezogen geprüft']],
['Personelle Überforderung',['Entlastung und Unterstützung sind organisiert','Belastung kann offen angesprochen werden','Leitung wird bei kritischen Situationen einbezogen']],
['Fehler- und Reflexionskultur',['Regelmäßige Fallbesprechungen','Kritik und Beschwerden werden ernst genommen','Grenzverletzungen werden nicht verharmlost']],
['Diskriminierung und Ausgrenzung',['Diskriminierungssensible Reflexion','Barrierearme Teilhabe','Beschwerdewege bei Ausgrenzung']],
['Unterstützte und nonverbale Kommunikation',['Alternative Kommunikationsformen werden genutzt','Nonverbale Ablehnung wird respektiert','Verständliche Beschwerdewege bestehen']],
['Beteiligung und Beschwerdemöglichkeiten',['Alters- und entwicklungsangemessene Beteiligung','Niedrigschwellige Beschwerden','Rückmeldung an Kinder zu Beschwerden']],
['Medizinische Unterstützungsbedarfe',['Verantwortlichkeiten sind geklärt','Notfallabläufe sind bekannt','Fachliche Absprachen sind dokumentiert']],
['Zusammenarbeit mit Eltern',['Transparente Absprachen','Schutzbedarfe werden gemeinsam reflektiert','Beschwerdewege sind bekannt']],
['Dokumentation und Meldeverfahren',['Dokumentationswege sind festgelegt','Leitung prüft besondere Vorkommnisse','Meldepflichten werden anhand aktueller Vorgaben geprüft']]
];
let state=blank(),step=0;
function blank(){return {facility:{name:'',children:'',groups:'',floors:'',concept:'',conditions:[],other:''},floors:['Erdgeschoss','Obergeschoss'],rooms:[],persons:PERSONS.map(name=>({name,answers:{},notes:'',risk:{}})),themes:THEMES.map(([name])=>({name,measures:[],notes:'',risk:{}})),review:{date:'',responsible:'',measures:'',next:'',signature:''}}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function field(label,path,value='',type='text',extra=''){let control=type==='textarea'?`<textarea data-path="${esc(path)}" ${extra}>${esc(value)}</textarea>`:`<input type="${type}" data-path="${esc(path)}" value="${esc(value)}" ${extra}>`;return `<label class="field">${esc(label)}${control}</label>`}
function select(label,path,value,options){return `<label class="field">${esc(label)}<select data-path="${esc(path)}"><option value="">Bitte auswählen</option>${options.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${value===v?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`}
function check(label,path,checked){return `<label class="check"><input type="checkbox" data-path="${esc(path)}" ${checked?'checked':''}><span>${esc(label)}</span></label>`}
const FRAME='Die Anwendung stellt ausschließlich einen Erfassungs- und Dokumentationsrahmen bereit. Alle Bewertungen und Entscheidungen erfolgen allein durch die bearbeitenden Fachkräfte und die verantwortliche Leitung. Die App nimmt keine eigene Risikoeinschätzung vor.';
function notice(){return `<aside class="notice important" role="note"><strong>Verbindlicher fachlicher Vorbehalt</strong><p>${esc(DISCLAIMER)}</p><p><strong>Rollenverteilung:</strong> ${esc(FRAME)}</p></aside>`}
function risk(r,path){r=r||{};let opts=[['low','Gering'],['medium','Mittel'],['high','Hoch']];let sel=(name,label)=>select(label,`${path}.${name}`,r[name]||'',opts);return `<div class="risk"><h3>Vorläufige Risikobewertung <span class="pill ${esc(r.residual||'')}">${esc(r.residual==='low'?'Gering':r.residual==='medium'?'Mittel':r.residual==='high'?'Hoch':'Noch nicht bewertet')}</span></h3><p class="small">Nur Sie als bearbeitende Fachkraft treffen diese Einschätzung. Die App berechnet, empfiehlt oder verändert keine Risikostufe.</p><div class="risk-grid">${sel('potential','Ursprüngliches Gefährdungspotenzial')}${select('Wirksamkeit bestehender Maßnahmen',`${path}.effectiveness`,r.effectiveness||'',[['unknown','Nicht geprüft'],['weak','Unzureichend'],['partial','Teilweise wirksam'],['effective','Nachweislich wirksam']])}${sel('residual','Verbleibendes Restrisiko')}${field('Zusätzlicher Handlungsbedarf',`${path}.action`,r.action||'','textarea')}</div></div>`}
function render(){document.getElementById('nav').innerHTML=STEPS.map((n,i)=>`<button type="button" data-step="${i}" aria-current="${i===step?'step':'false'}">${i}. ${n}</button>`).join('');let html='';if(step===0)html=home();if(step===1)html=facility();if(step===2)html=rooms();if(step===3)html=persons();if(step===4)html=themes();if(step===5)html=results();document.getElementById('app').innerHTML=html;document.querySelectorAll('select[data-path$=".potential"],select[data-path$=".residual"]').forEach(el=>el.classList.add(el.value));}
function home(){return `<section class="card hero"><div class="eyebrow">Pädagogisches Reflexionsinstrument · Version 1.3</div><h1>Kita-RisikoCheck</h1><p class="tagline">Risiken erkennen. Schutzmaßnahmen reflektieren. Qualität entwickeln.</p><p class="lead">Dokumentieren Sie mit einem digitalen Ankreuzbogen eine strukturierte Risiko- und Schutzanalyse Ihrer Kindertageseinrichtung – mit besonderem Blick auf inklusive Pädagogik, räumliche Transparenz, Personal und Kinderschutz.</p>${notice()}<div class="notice"><strong>Datenschutz:</strong> Alle Eingaben bleiben ausschließlich während dieser Sitzung im Browser. Es gibt keine Projekt-Speicherfunktion und keinen Datei-Upload. Es gibt keine Speicherung, kein Tracking und keine Übertragung. Beim Neuladen oder Schließen gehen Ihre Eingaben verloren. Bitte keine personenbezogenen Falldaten eintragen.</div><div class="actions"><button class="btn" data-step="1">Eigene Analyse starten</button><button class="btn secondary" data-action="sample">Musteranalyse laden</button></div><p><a href="https://www.andreas-aguirre.de" target="_blank" rel="noopener">Andreas Aguirre – Coaching für Kitas &amp; Familienzentren</a></p></section>`}
function stephead(title,desc){return `<div class="stephead"><h1>${title}</h1><p>${desc}</p></div>`+(step>=2&&step<=4?notice():'')}
function pager(){return `<div class="actions no-print">${step>0?`<button class="btn secondary" data-step="${step-1}">Zurück</button>`:''}${step<5?`<button class="btn" data-step="${step+1}">Weiter</button>`:''}</div>`}
function facility(){let f=state.facility;return stephead('1 · Angaben zur Einrichtung','Bitte nur allgemeine Strukturdaten eintragen, keine personenbezogenen Falldaten.')+`<section class="card"><div class="grid">${field('Name der Einrichtung (optional)','facility.name',f.name)}${field('Anzahl der Kinder','facility.children',f.children,'number','min="0"')}${field('Anzahl der Gruppen','facility.groups',f.groups,'number','min="0"')}${field('Anzahl der Etagen','facility.floors',f.floors,'number','min="1"')}${select('Pädagogisches Konzept','facility.concept',f.concept,['Offen','Teiloffen','Gruppenbezogen','Sonstiges'])}<div class="full"><h3>Besondere Rahmenbedingungen</h3>${['Inklusive Betreuung','Basisleistung I','Familienzentrum'].map(v=>check(v,`facility.conditions|${v}`,f.conditions.includes(v))).join('')}</div><div class="full">${field('Weitere Rahmenbedingungen (ohne Falldaten)','facility.other',f.other,'textarea')}</div></div></section>`+pager()}
function newRoom(type='Gruppenraum',floor='Erdgeschoss'){return {name:'',floor,type,visibility:'',use:'',oneToOne:'',hazards:'',protections:'',notes:'',risk:{},group:'',groupForm:'',access:'',conditions:[],measures:[]}}
const ROOM_CONDITIONS=['Tür ohne Sichtfenster','Glastür oder Sichtfenster','Nicht vollständig einsehbare Bereiche','Rückzugsmöglichkeiten vorhanden','Zeitweise Nutzung ohne direkte Anwesenheit einer Fachkraft','Wechselnde Gruppennutzung','Eins-zu-eins-Situationen möglich','Externe Personen nutzen den Raum','Zugang zu Material oder Geräten','Intime Pflege- oder Umkleidesituation','Barrieren oder schwer zugängliche Bereiche','Verbindung zu weiteren Räumen'];
const ROOM_MEASURES=['Glastür oder Sichtfenster vorhanden','Aufenthaltsorte der Kinder sind bekannt','Regelmäßige Sicht- und Kontaktkontrollen','Verbindliche Absprachen zur Aufsicht','Raumwechsel werden begleitet','Türen werden nicht abgeschlossen','Intimsphäre wird geschützt','An- und Abmeldung externer Personen','Übergaben und Zuständigkeiten sind geregelt','Kinder haben zugängliche Beschwerdemöglichkeiten'];
function roomCards(){return state.rooms.map((r,i)=>`<details class="card room-card" ${window.openRoom===i?'open':''}><summary><strong>${esc(r.name||r.type)}${r.groupForm?' · Form '+esc(r.groupForm):''}</strong><span class="small">${esc(r.floor||'Etage offen')} · <span class="pill ${esc(r.risk?.residual||'')}">${riskLabel(r.risk?.residual)}</span></span></summary><div class="grid room-fields">${field('Raumbezeichnung',`rooms.${i}.name`,r.name)}${select('Raumtyp',`rooms.${i}.type`,r.type,ROOM_TYPES)}${select('Etage',`rooms.${i}.floor`,r.floor,state.floors)}${select('Gruppenform (KiBiz)',`rooms.${i}.groupForm`,r.groupForm||'',['I','II','III'])}${select('Zugang für Kinder',`rooms.${i}.access`,r.access||'',['Frei zugänglich','Nur begleitet','Kein Zutritt für Kinder','Situationsabhängig'])}${select('Einsehbarkeit',`rooms.${i}.visibility`,r.visibility,['Vollständig einsehbar','Teilweise einsehbar','Nicht einsehbar'])}${select('Nutzung',`rooms.${i}.use`,r.use,['Kinder allein','Mit pädagogischen Fachkräften','Mit externen Personen','Wechselnde Nutzung'])}${select('Eins-zu-eins-Situationen möglich?',`rooms.${i}.oneToOne`,r.oneToOne,['Ja','Nein','Unklar'])}</div><h3>Räumliche Bedingungen – nur Zutreffendes ankreuzen</h3><div class="checks">${ROOM_CONDITIONS.map((m,j)=>check(m,`rooms.${i}.conditions|${j}`,(r.conditions||[]).includes(j))).join('')}</div><h3>Bestehende Schutzmaßnahmen – nur Zutreffendes ankreuzen</h3><div class="checks">${ROOM_MEASURES.map((m,j)=>check(m,`rooms.${i}.measures|${j}`,(r.measures||[]).includes(j))).join('')}</div><details class="extra"><summary>Weitere Angaben und besondere Gefährdungen</summary><div class="grid">${field('Mögliche Gefährdungen',`rooms.${i}.hazards`,r.hazards,'textarea')}${field('Weitere bestehende Schutzmaßnahmen',`rooms.${i}.protections`,r.protections,'textarea')}${field('Besonderheiten und Kommentare',`rooms.${i}.notes`,r.notes,'textarea')}</div></details>${risk(r.risk,`rooms.${i}.risk`)}<div class="actions"><button class="btn secondary" data-action="copyRoomMeasures" data-index="${i}">Schutzmaßnahmen auf ähnliche Räume übertragen</button><button class="btn danger" data-action="deleteRoom" data-index="${i}">Raum entfernen</button></div></details>`).join('')}
function groupSetup(){let n=Math.max(0,Math.min(50,Number(state.facility.groups)||0));return `<section class="card"><h2>1. Gruppenräume in Sekunden anlegen</h2><p class="small">Aus der Gruppenanzahl werden Gruppenräume vorbereitet. Namen, Etage, Gruppenform und zugehörige Räume lassen sich vor dem Anlegen anpassen. Bereits erfasste Räume bleiben erhalten.</p><div class="actions"><button class="btn secondary" data-action="prepareGroups">${n} Gruppen vorbereiten</button></div>${window.groupDraft?.length?`<div class="group-list">${window.groupDraft.map((g,i)=>`<div class="group-row"><h3>Gruppe ${i+1}</h3><div class="grid">${field('Gruppenname',`_group.${i}.name`,g.name)}${select('Etage',`_group.${i}.floor`,g.floor,state.floors)}${select('Gruppenform (KiBiz)',`_group.${i}.form`,g.form,['I','II','III'])}${field('Anzahl Nebenräume',`_group.${i}.side`,g.side,'number','min="0" max="30"')}${field('Anzahl Schlafräume',`_group.${i}.sleep`,g.sleep,'number','min="0" max="30"')}${field('Anzahl Wasch-/Pflegeräume',`_group.${i}.care`,g.care,'number','min="0" max="30"')}</div></div>`).join('')}</div><div class="actions"><button class="btn" data-action="createGroups">Gruppen und zugehörige Räume anlegen</button></div>`:''}</section>`}
function sharedSetup(){return `<section class="card"><h2>2. Weitere Räume schnell ergänzen</h2><p class="small">Zum Beispiel Küche, Turnhalle, Therapieräume, Flure oder Außengelände. Auch Räume ohne Kinderzutritt können erfasst werden.</p><div class="grid">${select('Raumart','_roomTemplate',window.roomTemplate||'Bewegungsraum',ROOM_TYPES)}${field('Anzahl','_roomCount',window.roomCount||1,'number','min="1" max="100"')}${select('Etage','_roomFloor',window.roomFloor||state.floors[0],state.floors)}${select('Zugang für Kinder','_roomAccess',window.roomAccess||'',['Frei zugänglich','Nur begleitet','Kein Zutritt für Kinder','Situationsabhängig'])}</div><div class="actions"><button class="btn secondary" data-action="addManyRooms">Räume hinzufügen</button></div></section>`}

function rooms(){return stephead('2 · Räume und Etagen','Zuerst die Raumstruktur schnell erfassen, danach jeden Raum einzeln bewerten.')+`<section class="card"><div class="toolbar"><h2>Etagen</h2><button class="btn secondary" data-action="floor">+ Etage</button></div><div class="grid">${state.floors.map((v,i)=>field(`Etage ${i+1}`,`floors.${i}`,v)).join('')}</div></section>`+groupSetup()+sharedSetup()+`<section class="card"><h2>3. Einzelbewertung (${state.rooms.length} Räume)</h2><p class="small">Tippen Sie einen Raum an, um ihn zu bewerten. Noch nicht bewertete Räume bleiben ausdrücklich offen. Schutzmaßnahmen können bei Bedarf auf gleichartige Räume übertragen werden, nicht jedoch Risikoeinstufungen.</p></section>`+roomCards()+pager()}
function persons(){return stephead('3 · Personelle Risiken','Bewerten Sie die einzelnen Personengruppen unabhängig voneinander. Häkchen kennzeichnen tatsächlich bestehende Regelungen.')+state.persons.map((p,i)=>`<section class="card"><h2>${esc(p.name)}</h2><div class="checks">${PERSON_QUESTIONS.map((q,j)=>check(q,`persons.${i}.answers|${j}`,!!p.answers[j])).join('')}</div>${field('Beobachtungen, Regelungslücken und Hinweise',`persons.${i}.notes`,p.notes,'textarea')}${risk(p.risk,`persons.${i}.risk`)}</section>`).join('')+pager()}
function themes(){return stephead('4 · Pädagogische und inklusive Risikobereiche','Kreuzen Sie ausschließlich nachweislich umgesetzte Schutzmaßnahmen an. Nicht ausgewählte Maßnahmen werden nicht als bestehend ausgegeben.')+THEMES.map(([name,ms],i)=>{let t=state.themes[i];return `<section class="card"><h2>${i+1}. ${esc(name)}</h2>${i===8?'<div class="notice important"><strong>Besonderer rechtlicher Hinweis:</strong> Körperliches Festhalten ist nicht pauschal zulässig. Mildere Mittel haben Vorrang. Rechtliche Voraussetzungen, Erforderlichkeit und Verhältnismäßigkeit sowie gegebenenfalls Meldepflichten sind für jeden Einzelfall zu prüfen. Keine Anwendung als Strafe oder zur Durchsetzung von Gehorsam.</div>':''}<h3>Bestehende Schutzmaßnahmen</h3><div class="checks">${ms.map((m,j)=>check(m,`themes.${i}.measures|${j}`,t.measures.includes(j))).join('')}</div>${field('Weitere tatsächlich bestehende Maßnahmen, Beobachtungen und Verbesserungsbedarf',`themes.${i}.notes`,t.notes,'textarea')}${risk(t.risk,`themes.${i}.risk`)}</section>`}).join('')+pager()}
function results(){let doc=generate();return stephead('5 · Übersicht und Maßnahmenplan','Kompakte Dokumentation zum Ankreuzen und handschriftlichen Ergänzen. Sämtliche Einstufungen stammen ausschließlich von den Bearbeitenden.')+notice()+`<section class="card no-print"><h2>Angaben für die Dokumentation</h2><div class="grid">${field('Datum / Stand','review.date',state.review.date,'date')}${field('Verantwortliche / Beteiligte','review.responsible',state.review.responsible)}${field('Übergreifende Aufgaben (optional)','review.measures',state.review.measures,'textarea')}${field('Nächster Überprüfungstermin','review.next',state.review.next,'date')}${field('Freigabe (optional)','review.signature',state.review.signature)}</div></section><div class="actions no-print"><button class="btn" data-action="print">Arbeitsfassung drucken / PDF</button><button class="btn secondary" data-action="copy">Strukturierte Angaben kopieren</button><button class="btn secondary" data-action="txt">Text für weitere Bearbeitung (.txt)</button></div><p id="feedback" class="status no-print" role="status" aria-live="polite"></p><div id="printArea"><div class="report">${renderReport()}</div></div>`+pager()}

function getPath(path){return path.split('.').reduce((o,k)=>o?.[k],state)}
function setPath(path,val){let parts=path.split('.'),obj=state;for(let i=0;i<parts.length-1;i++)obj=obj[parts[i]];obj[parts.at(-1)]=val}
function changed(el){let p=el.dataset.path;if(!p)return;if(p==='_roomTemplate'){window.roomTemplate=el.value;return}if(p==='_roomFloor'){window.roomFloor=el.value;return}if(p==='_roomCount'){window.roomCount=el.value;return}if(p==='_roomAccess'){window.roomAccess=el.value;return}if(p.startsWith('_group.')){let [,i,k]=p.split('.');if(window.groupDraft?.[Number(i)])window.groupDraft[Number(i)][k]=el.value;return}if(p.includes('|')){let [base,item]=p.split('|'),v=getPath(base);if(Array.isArray(v)){let n=Number(item);if(el.checked&&!v.includes(n))v.push(n);if(!el.checked&&v.includes(n))v.splice(v.indexOf(n),1)}else{v[item]=el.checked}return}setPath(p,el.value);if(p.endsWith('.residual')){let box=el.closest('.risk');let badge=box?.querySelector('.pill');if(badge){badge.className='pill '+el.value;badge.textContent=riskLabel(el.value)} }if(el.tagName==='SELECT'&&p.includes('.risk.')){el.classList.remove('low','medium','high');el.classList.add(el.value)}if(step===5){let out=document.querySelector('.report');if(out)out.innerHTML=renderReport()}}
function riskLabel(v){return ({low:'Gering',medium:'Mittel',high:'Hoch'})[v]||'Noch nicht bewertet'}
function sentence(s){s=String(s||'').trim();return s?s.replace(/[.;\s]+$/,'')+'.':''}
function riskText(r){r=r||{};let a=[];a.push(`Das ursprüngliche Gefährdungspotenzial ist ${r.potential?'vorläufig als '+riskLabel(r.potential).toLowerCase()+' eingeschätzt':'noch nicht bewertet'}.`);let e=({unknown:'noch nicht geprüft',weak:'als unzureichend beurteilt',partial:'als teilweise wirksam beurteilt',effective:'als nachweislich wirksam beurteilt'})[r.effectiveness];a.push(`Die Wirksamkeit der Schutzmaßnahmen ist ${e||'noch nicht bewertet'}.`);a.push(`Das verbleibende Restrisiko ist ${r.residual?'vorläufig als '+riskLabel(r.residual).toLowerCase()+' eingeschätzt':'noch nicht bewertet'}.`);if(r.action?.trim())a.push('Zusätzlicher Handlungsbedarf: '+sentence(r.action));return a.join(' ')}
function para(s){return s+'\n\n'}

const ACTION_HINTS={
'Teiloffene und offene Arbeit':'Aufenthaltsübersicht, Absprachen zwischen den Gruppen und tatsächliche Aufsicht bei Raumwechseln gemeinsam überprüfen.',
'Aufsichtspflicht und Raumwechsel':'Zuständigkeiten für Raumwechsel, Übergaben und nicht einsehbare Bereiche konkret festlegen.',
'Pflege und Intimsphäre':'Pflegeabläufe, Wahrung der Intimsphäre und die Wahrnehmung verbaler sowie nonverbaler Grenzen überprüfen.',
'Schlaf- und Ruhesituationen':'Aufsicht, Erreichbarkeit und Schutz der Intimsphäre in Ruhephasen gemeinsam prüfen.',
'Therapeutische Einzelsettings':'An- und Abmeldung, Übergaben und Einsehbarkeit externer Einzelsettings überprüfen.',
'Kita-Assistenzen und intensive Begleitung':'Einarbeitung, Zuständigkeiten und Grenzen pflegerischer Aufgaben verbindlich klären.',
'Herausforderndes Verhalten':'Frühe Deeskalation, Co-Regulation und Nachbereitung belastender Situationen überprüfen.',
'Konflikte und Übergriffe zwischen Kindern':'Schutz betroffener Kinder und Abläufe zur Wahrnehmung, Dokumentation und Nachbereitung von Übergriffen prüfen.',
'Körperliche Interventionen in akuten Gefährdungssituationen':'Deeskalation, rechtliche Voraussetzungen, Verhältnismäßigkeit, Dokumentation und Prüfung möglicher Meldepflichten fallbezogen überprüfen.',
'Personelle Überforderung':'Entlastungswege, Vertretung und Möglichkeiten zum frühzeitigen Ansprechen von Überforderung prüfen.',
'Fehler- und Reflexionskultur':'Verbindliche Reflexions- und Beschwerdewege im Team überprüfen.',
'Diskriminierung und Ausgrenzung':'Barrieren und diskriminierende Situationen erfassen und wirksame Beschwerdewege prüfen.',
'Unterstützte und nonverbale Kommunikation':'Verständliche Beteiligungs- und Beschwerdemöglichkeiten für nichtsprechende Kinder überprüfen.',
'Beteiligung und Beschwerdemöglichkeiten':'Zugänglichkeit, Vertraulichkeit und Rückmeldung zu Beschwerden überprüfen.',
'Medizinische Unterstützungsbedarfe':'Zuständigkeiten, fachliche Absprachen und Vorgehen in Notfällen prüfen, ohne Falldaten im Tool zu erfassen.',
'Zusammenarbeit mit Eltern':'Transparente Informations- und Beschwerdewege mit Sorgeberechtigten überprüfen.',
'Dokumentation und Meldeverfahren':'Interne Dokumentationswege und die einzelfallbezogene Prüfung gesetzlicher Meldepflichten überprüfen.'};
function genericAction(s){return /^(Verfahren und tatsächliche Umsetzung gemeinsam überprüfen\.?|Wirksamkeit im Team anhand konkreter Abläufe überprüfen\.?)$/i.test((s||'').trim())}
function actionFor(name,r){if(!r?.action?.trim())return '';if(genericAction(r.action)){return ACTION_HINTS[name]||((name.includes('Pflege')||name.includes('Nebenraum'))?'Einsehbarkeit, Aufsicht und Wirksamkeit der Schutzmaßnahmen anhand der tatsächlichen Nutzung überprüfen.':'Bestehende Regelungen und ihre Wirksamkeit im Team anhand konkreter Abläufe überprüfen.')}return r.action.trim()}
function reportItems(){return [...state.rooms.map(r=>({name:'Raum: '+(r.name||r.type),risk:r.risk,kind:'Raum'})),...state.persons.map(p=>({name:p.name,risk:p.risk,kind:'Personal'})),...state.themes.map(t=>({name:t.name,risk:t.risk,kind:'Pädagogik'}))]}
function reportRows(){return [...state.rooms.map(r=>({section:'Räume',name:r.name||r.type,conditions:[...(r.conditions||[]).map(i=>ROOM_CONDITIONS[i]).filter(Boolean),r.access?'Zugang: '+r.access:'',r.visibility?'Einsehbarkeit: '+r.visibility:'',r.use?'Nutzung: '+r.use:'',r.oneToOne?'Einzelsettings: '+r.oneToOne:''].filter(Boolean),measures:[...(r.measures||[]).map(i=>ROOM_MEASURES[i]).filter(Boolean),r.protections].filter(Boolean),notes:[r.hazards,r.notes].filter(Boolean).join(' / '),risk:r.risk||{},floor:r.floor,form:r.groupForm})),...state.persons.map(p=>({section:'Personal',name:p.name,conditions:[],measures:Object.keys(p.answers).filter(k=>p.answers[k]).map(k=>PERSON_QUESTIONS[Number(k)]),notes:p.notes,risk:p.risk||{}})),...state.themes.map((t,i)=>({section:'Pädagogik',name:t.name,conditions:[],measures:t.measures.map(j=>THEMES[i][1][j]).filter(Boolean),notes:t.notes,risk:t.risk||{}}))]}
function tasks(){let a=reportRows().filter(x=>x.risk.action?.trim()).map(x=>({name:x.name,action:x.risk.action.trim()}));if(state.review.measures.trim())a.push({name:'Übergreifend',action:state.review.measures.trim()});return a}
function generate(){let f=state.facility,rows=reportRows(),out=['KITA-RISIKOCHECK 1.3 – STRUKTURIERTE ARBEITSFASSUNG',DISCLAIMER,FRAME,'Keine Speicherung und keine Übertragung der Eingaben. Keine personenbezogenen Angaben zu einzelnen Kindern eingeben.','EINRICHTUNG: '+(f.name||'Nicht angegeben')+' | Kinder: '+(f.children||'–')+' | Gruppen: '+(f.groups||'–')+' | Etagen: '+(f.floors||'–')+' | Konzept: '+(f.concept||'–'),'Rahmenbedingungen: '+(f.conditions.join(', ')||'–')];for(let section of ['Räume','Personal','Pädagogik']){out.push('\n'+section.toUpperCase());for(let r of rows.filter(x=>x.section===section)){out.push('\n'+r.name+(r.floor?' | '+r.floor:'')+(r.form?' | KiBiz-Form '+r.form:''));out.push('Bedingungen: '+(r.conditions.join('; ')||'Nicht angegeben'));out.push('Schutzmaßnahmen (von Bearbeitenden bestätigt): '+(r.measures.join('; ')||'Nicht angegeben'));out.push('Ursprüngliches Risiko (Fachkraft): '+riskLabel(r.risk.potential)+' | Wirksamkeit (Fachkraft): '+effectLabel(r.risk.effectiveness)+' | Restrisiko (Fachkraft): '+riskLabel(r.risk.residual));if(r.notes)out.push('Anmerkungen: '+r.notes);if(r.risk.action)out.push('Festgelegte Aufgabe: '+r.risk.action)}}out.push('\nOFFENE BEWERTUNGEN');out.push(...rows.filter(r=>!r.risk.residual).map(r=>'□ '+r.section+': '+r.name));out.push('\nTO-DO-LISTE (ausschließlich eingegebene Aufgaben)');out.push(...tasks().map(t=>'□ '+t.name+': '+t.action+' | Zuständig: ______ | Frist: ______ | Erledigt: ______'));out.push('\nStand: '+(state.review.date||'________')+' | Beteiligte: '+(state.review.responsible||'________')+' | Nächste Prüfung: '+(state.review.next||'________')+' | Freigabe: '+(state.review.signature||'________'));return out.join('\n')}
function renderReport(){let f=state.facility,rows=reportRows(),h='<div class="report-head"><h1>Risiko- und Schutzanalyse · Arbeitsfassung</h1><p>Kita-RisikoCheck Version 1.3 · Andreas Aguirre – Coaching für Kitas & Familienzentren</p></div><div class="report-note"><strong>Fachlicher Vorbehalt:</strong> '+esc(DISCLAIMER)+'<p><strong>Verantwortung:</strong> '+esc(FRAME)+'</p></div>';h+='<h2>Einrichtung</h2><p><strong>'+esc(f.name||'Name offen')+'</strong> · '+esc(f.children||'–')+' Kinder · '+esc(f.groups||'–')+' Gruppen · '+esc(f.floors||'–')+' Etagen · '+esc(f.concept||'Konzept offen')+'</p><p>'+esc(f.conditions.join(', ')||'Keine Rahmenbedingungen angegeben')+'</p>';let rated=rows.filter(r=>r.risk.residual),unrated=rows.filter(r=>!r.risk.residual);h+='<h2>Bearbeitungsstand</h2><p>'+rated.length+' von '+rows.length+' Prüffeldern durch Bearbeitende eingestuft · '+unrated.length+' noch offen. <strong>Keine automatische Gesamtbewertung.</strong></p>';for(let section of ['Räume','Personal','Pädagogik']){h+='<h2>'+esc(section==='Räume'?'Räumliche Bedingungen und Schutzmaßnahmen':section==='Personal'?'Personelle Prüffelder':'Pädagogische Prüffelder')+'</h2>';for(let r of rows.filter(x=>x.section===section)){let active=section==='Räume'||r.measures.length||r.notes||Object.values(r.risk).some(Boolean);if(!active)continue;h+='<article class="report-item"><div class="report-item-head"><strong>'+esc(r.name)+'</strong><span class="pill '+esc(r.risk.residual||'')+'">'+esc(riskLabel(r.risk.residual))+'</span></div>';if(r.floor||r.form)h+='<p class="small">'+esc([r.floor,r.form?'Gruppenform '+r.form:''].filter(Boolean).join(' · '))+'</p>';if(r.conditions.length)h+='<p><strong>Bedingungen:</strong> '+r.conditions.map(v=>'☑ '+esc(v)).join(' · ')+'</p>';h+='<p><strong>Bestätigte Schutzmaßnahmen:</strong> '+(r.measures.length?r.measures.map(v=>'☑ '+esc(v)).join(' · '):'Keine Angaben')+'</p>';h+='<p><strong>Einschätzung der Fachkraft:</strong> Ausgangsrisiko '+esc(riskLabel(r.risk.potential))+' · Wirksamkeit '+esc(effectLabel(r.risk.effectiveness))+' · Restrisiko <strong>'+esc(riskLabel(r.risk.residual))+'</strong></p>';if(r.notes)h+='<p><strong>Ergänzende Angaben:</strong> '+esc(r.notes)+'</p>';if(r.risk.action)h+='<p><strong>Festgelegte Aufgabe:</strong> '+esc(r.risk.action)+'</p>';h+='<div class="note-lines"><strong>Besondere Bemerkungen / fachliche Ergänzungen:</strong><div></div><div></div></div></article>'}let open=rows.filter(x=>x.section===section&&!x.risk.residual);if(open.length)h+='<p class="open-fields"><strong>Noch nicht bewertet:</strong> '+open.map(x=>esc(x.name)).join(' · ')+'</p>'}h+='<h2>To-do-Liste / Maßnahmenplan</h2><p class="small">Nur ausdrücklich von Bearbeitenden eingetragene Aufgaben. Prioritäten werden nicht automatisch vergeben.</p><table class="todo-table"><thead><tr><th>Erledigt</th><th>Bereich / Aufgabe</th><th>Zuständig</th><th>Bis wann</th></tr></thead><tbody>';for(let t of tasks())h+='<tr><td>☐</td><td><strong>'+esc(t.name)+'</strong><div>'+esc(t.action)+'</div></td><td>____________</td><td>____________</td></tr>';if(!tasks().length)h+='<tr><td>☐</td><td colspan="3">Keine Aufgaben eingetragen – im Team prüfen und bei Bedarf handschriftlich ergänzen.</td></tr>';for(let i=0;i<3;i++)h+='<tr><td>☐</td><td>________________________________</td><td>____________</td><td>____________</td></tr>';h+='</tbody></table><h2>Abschluss / Freigabe</h2><p>Stand: '+esc(state.review.date||'____________')+' · Beteiligte: '+esc(state.review.responsible||'____________')+' · Nächste Überprüfung: '+esc(state.review.next||'____________')+'</p><p>Freigabe / Unterschrift: '+esc(state.review.signature||'________________________________')+'</p><p class="small">Die Auswahl einer Schutzmaßnahme belegt nicht deren Wirksamkeit. Alle Einstufungen sind Angaben der bearbeitenden Fachkräfte.</p>';return h}

function effectLabel(v){return ({unknown:'Nicht geprüft',weak:'Unzureichend',partial:'Teilweise wirksam',effective:'Nachweislich wirksam'})[v]||'Noch nicht bewertet'}
function sample(){state=blank();state.facility={name:'Fiktive inklusive Kita – anonymisiertes Muster',children:'114',groups:'6',floors:'2',concept:'Teiloffen',conditions:['Inklusive Betreuung','Basisleistung I','Familienzentrum'],other:'Vier Gruppen im Erdgeschoss, zwei Gruppen im Obergeschoss; ergänzende Nebenräume.'};state.rooms=[['Gruppenraum EG mit Glastür','Erdgeschoss','Gruppenraum','Vollständig einsehbar','Mit pädagogischen Fachkräften','Ja','Unbeobachtete Einzelmomente bei wechselnder Nutzung.','Glastüren ermöglichen Einblick; gruppenübergreifende Absprachen.','medium','low'],['Nebenraum OG','Obergeschoss','Nebenraum','Teilweise einsehbar','Kinder allein','Ja','Konflikte und Grenzverletzungen können verzögert wahrgenommen werden.','Absprachen zu Aufenthaltsorten; situationsangepasste Aufsicht.','medium','medium'],['Pflegebereich EG','Erdgeschoss','Pflegebereich','Nicht einsehbar','Mit pädagogischen Fachkräften','Ja','Abhängigkeit und erhöhte Schutzbedürftigkeit in intimen Situationen.','Keine abgeschlossenen Türen; Ankündigung der Pflege; Wahrung der Intimsphäre.','high','medium'],['Therapieraum OG','Obergeschoss','Therapieraum','Teilweise einsehbar','Mit externen Personen','Ja','Externe Einzelsettings ohne ständige unmittelbare Beobachtung.','An- und Abmeldung; dokumentierte Übergaben und Aufenthaltsorte.','high','medium']].map(([name,floor,type,visibility,use,oneToOne,hazards,protections,potential,residual])=>({name,floor,type,visibility,use,oneToOne,hazards,protections,notes:'',risk:{potential,residual,effectiveness:'partial',action:'Wirksamkeit im Team anhand konkreter Abläufe überprüfen.'}}));state.persons[2].answers={0:true,2:true,3:true};state.persons[2].notes='Externe Assistenzkräfte werden eingearbeitet; Zuständigkeiten und Pflegegrenzen sind regelmäßig zu reflektieren.';state.persons[2].risk={potential:'high',residual:'medium',effectiveness:'partial',action:'Handreichung für externe Assistenzkräfte fachlich abstimmen.'};state.persons[3].answers={0:true,3:true,4:true};state.persons[3].risk={potential:'high',residual:'medium',effectiveness:'partial',action:'Übergaberegeln überprüfen.'};for(let [i,indices,potential,residual] of [[0,[0,1,2], 'medium','medium'],[2,[0,1,2,3],'high','medium'],[4,[0,1,2],'high','medium'],[5,[0,1,2],'high','medium'],[6,[0,1,2],'high','medium'],[7,[0,1,2],'high','medium'],[8,[0,1,2,3,4],'high','medium'],[9,[0,1],'medium','medium'],[16,[0,1,2],'high','medium']]){state.themes[i].measures=indices;state.themes[i].risk={potential,residual,effectiveness:'partial',action:'Verfahren und tatsächliche Umsetzung gemeinsam überprüfen.'}}state.themes[8].notes='Im fiktiven Beispiel werden körperliche Interventionen schriftlich dokumentiert. Besondere Meldepflichten gegenüber dem zuständigen Landesjugendamt bzw. Landschaftsverband und gegebenenfalls im Zusammenhang mit Basisleistung I werden einzelfallbezogen geprüft.';state.review.measures='Schutzstandards für Einzelsettings und externe Assistenz weiterentwickeln.';step=1;render();window.scrollTo(0,0)}
document.addEventListener('input',e=>{if(e.target.matches('[data-path]'))changed(e.target)});document.addEventListener('change',e=>{if(e.target.matches('[data-path]'))changed(e.target)});document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.step!==undefined){step=Number(b.dataset.step);render();window.scrollTo(0,0);return}let action=b.dataset.action;if(action==='sample'){if(state.rooms.length&&!confirm('Die bisherigen Eingaben werden durch das fiktive Muster ersetzt. Fortfahren?'))return;sample()}if(action==='prepareGroups'){let n=Math.max(0,Math.min(50,Number(state.facility.groups)||0));if(!n){alert('Bitte zuerst in Schritt 1 die Anzahl der Gruppen eintragen.');return}window.groupDraft=Array.from({length:n},(_,i)=>({name:`Gruppe ${i+1}`,floor:state.floors[Math.min(i,state.floors.length-1)]||state.floors[0],form:'',side:'0',sleep:'0',care:'0'}));render()}
