<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073e78"><title>Kita-RisikoCheck – Andreas Aguirre</title><link rel="icon" href="favicon.svg"><style>
:root{--navy:#073e78;--blue:#35a8e5;--bg:#f3f7fb;--line:#d9e5ef;--ink:#18354d;--muted:#536a7d;--red:#b83b3b;--yellow:#936500;--green:#16764a}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--navy)}.shell{max-width:1100px;margin:auto;padding:20px}.head{background:white;border-bottom:4px solid var(--blue)}.brand{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand img{width:min(100%,430px);height:auto;display:block}.brand .mark{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:800}.mark img{width:46px;height:46px}.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}h1{color:var(--navy);font-size:clamp(1.9rem,4.5vw,3rem);line-height:1.14;margin:.4em 0}h2{color:var(--navy);margin:0 0 12px;font-size:1.45rem}h3{color:var(--navy);margin:0 0 8px;font-size:1.12rem}.lead{font-size:1.12rem;color:var(--muted);max-width:790px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;margin:16px 0;box-shadow:0 4px 14px #103e6610}.hero{padding:34px}.notice{border-left:5px solid var(--blue);background:#eaf5fd;padding:15px 18px;border-radius:9px;margin:20px 0}.notice.important{border-color:#e1a133;background:#fff8e8}.small{font-size:.89rem;color:var(--muted)}.muted{color:var(--muted)}.btn{border:0;border-radius:10px;padding:12px 18px;background:var(--navy);color:white;font-weight:700;min-height:46px}.btn:hover{filter:brightness(1.12)}.btn.secondary{background:#e7f2fb;color:var(--navy)}.btn.danger{background:#fff0ef;color:#992e2e}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:block;font-weight:650;font-size:.93rem}.field input,.field select,.field textarea{display:block;width:100%;border:1px solid #b9ccdb;background:white;border-radius:9px;padding:11px;color:var(--ink);margin-top:5px;font-weight:400}.field textarea{min-height:85px;resize:vertical}.full{grid-column:1/-1}.check{display:flex;align-items:flex-start;gap:9px;margin:8px 0;font-weight:450}.check input{width:19px;height:19px;flex-shrink:0;accent-color:var(--navy);margin-top:3px}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.nav{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0}.nav button{border:1px solid var(--line);background:white;color:var(--navy);border-radius:999px;padding:9px 14px;font-weight:650}.nav button[aria-current="step"]{background:var(--navy);color:white}.stephead{margin:22px 0}.stephead p{color:var(--muted)}.risk{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:15px;background:#f9fcff}.risk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.risk select{border-left:5px solid #a7b5c1}.risk select.low{border-left-color:#23915d}.risk select.medium{border-left-color:#e0ad30}.risk select.high{border-left-color:#d44b4b}.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:.8rem;font-weight:750;background:#e7edf3;color:#46596c}.pill.low{background:#d9f4e5;color:#12603d}.pill.medium{background:#fff0bd;color:#735000}.pill.high{background:#ffe1e1;color:#a52727}.result{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:25px;font-family:Georgia,serif;line-height:1.65;max-height:640px;overflow:auto}.footer{text-align:center;padding:24px 0 40px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:18px 0}.tagline{font-weight:600;color:var(--blue)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hidden{display:none!important}.status{font-size:.88rem;color:var(--muted)}@media(max-width:650px){.shell{padding:13px}.card{padding:16px}.hero{padding:22px}.grid,.risk-grid,.checks{grid-template-columns:1fr}.btn{width:100%}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{border-radius:9px}.brand img{max-width:340px}.actions{flex-direction:column}}@media print{body{background:white;color:black}.head,.nav,.actions,.footer,.no-print,.stephead{display:none!important}.shell{max-width:none;padding:0}#app>*:not(#printArea){display:none!important}#printArea{display:block!important}.result{border:0;max-height:none;overflow:visible;padding:0;white-space:pre-wrap;font-size:11pt}.notice{border:1px solid #777;background:white}.card{box-shadow:none;border:0;padding:0}}
</style></head><body><header class="head"><div class="shell brand"><a href="https://www.andreas-aguirre.de" target="_blank" rel="noopener" aria-label="Andreas Aguirre – Website"><img src="logo.jpeg" alt="Andreas Aguirre – Coaching für Kitas und Familienzentren"></a><div class="mark"><img src="favicon.svg" alt=""><span>Kita-RisikoCheck</span></div></div></header><main class="shell"><nav class="nav no-print" id="nav" aria-label="Arbeitsschritte"></nav><div id="app"></div></main><footer class="footer no-print"><a href="https://www.andreas-aguirre.de" target="_blank" rel="noopener">Andreas Aguirre – Coaching für Kitas &amp; Familienzentren</a><div class="small">Lokal im Browser · Keine Speicherung · Keine Übertragung von Eingaben</div></footer><script>
'use strict';
const DISCLAIMER='Diese Anwendung dient ausschließlich als erste strukturierte Bewertungsgrundlage. Sie ersetzt keine fachliche Gefährdungseinschätzung, keine individuelle Kinderschutzprüfung und keine gemeinsame Bewertung durch die verantwortlichen Fachkräfte und die Einrichtungsleitung. Alle Risikoeinstufungen sind vorläufig und müssen anhand der tatsächlichen Bedingungen vor Ort fachlich überprüft werden.';
const STEPS=['Start','Einrichtung','Räume','Personen','Pädagogik','Auswertung'];
const ROOM_TYPES=['Gruppenraum','Nebenraum','Schlafraum','Waschraum','Pflegebereich','Therapieraum','Bewegungsraum','Flur','Treppenhaus','Außengelände','Rückzugsbereich','Sonstiger Raum'];
const PERSONS=['Pädagogische Fachkräfte','Ergänzungskräfte','Kita-Assistenzen und Inklusionshilfen','Externe Therapeutinnen und Therapeuten','Frühförderkräfte','Praktikantinnen und Praktikanten','Ehrenamtliche','Eltern und Besucher','Sonstige externe Personen'];
const PERSON_QUESTIONS=['Eins-zu-eins-Situationen sind geregelt','Einarbeitung externer Personen ist geregelt','Kinderschutzkonzept und Verhaltensampel sind bekannt','Verbindliche Zuständigkeiten sind festgelegt','Aufenthaltsorte und Übergaben werden dokumentiert','Nähe und Distanz sind verbindlich geregelt','Beschwerdemöglichkeiten sind vorhanden','Überforderung wird erkannt und reflektiert','Melde- und Dokumentationswege sind verbindlich'];
const THEMES=[
['Teiloffene und offene Arbeit',['Transparente Aufenthaltsübersicht','Absprachen zwischen Gruppen','Situationsangemessene Aufsicht','Regelmäßige Überprüfung der Raumnutzung']],
['Aufsichtspflicht und Raumwechsel',['Verbindliche Übergaberegeln','Angepasste Aufsicht nach Situation','Klare Zuständigkeiten bei Etagenwechseln']],
['Pflege und Intimsphäre',['Wahrung der Intimsphäre','Pflegerische Handlungen werden angekündigt','Grenzen und nonverbale Signale werden beachtet','Keine abgeschlossenen Pflegeräume']],
['Schlaf- und Ruhesituationen',['Verbindliche Aufsicht und Kontrollen','Rückzugswünsche werden respektiert','Schlafräume sind organisatorisch zugeordnet']],
['Therapeutische Einzelsettings',['An- und Abmeldung externer Fachkräfte','Transparente Übergaben','Aufenthaltsorte sind bekannt','Beschwerdesignale werden wahrgenommen']],
['Kita-Assistenzen und intensive Begleitung',['Strukturierte Einarbeitung','Fachliche Begleitung durch Kita-Team','Verhaltensampel ist bekannt','Aufgaben und Grenzen sind geklärt']],
['Herausforderndes Verhalten',['Frühzeitige Deeskalation','Co-Regulation','Fallreflexion','Anpassung von Anforderungen und Reizen']],
['Konflikte und Übergriffe zwischen Kindern',['Grenzverletzungen werden aufgegriffen','Betroffene Kinder werden geschützt','Vorfälle werden nachbereitet','Kinder können Beschwerden äußern']],
['Körperliche Interventionen in akuten Gefährdungssituationen',['Deeskalation und mildere Mittel haben Vorrang','Rechtliche Voraussetzungen werden geprüft','Verhältnismäßigkeit und Dauer werden beachtet','Vorfälle werden dokumentiert und reflektiert','Meldepflichten werden einzelfallbezogen geprüft']],
['Personelle Überforderung',['Entlastung und Unterstützung sind organisiert','Belastung kann offen angesprochen werden','Leitung wird bei kritischen Situationen einbezogen']],
['Fehler- und Reflexionskultur',['Regelmäßige Fallbesprechungen','Kritik und Beschwerden werden ernst genommen','Grenzverletzungen werden nicht verharmlost']],
['Diskriminierung und Ausgrenzung',['Diskriminierungssensible Reflexion','Barrierearme Teilhabe','Beschwerdewege bei Ausgrenzung']],
['Unterstützte und nonverbale Kommunikation',['Alternative Kommunikationsformen werden genutzt','Nonverbale Ablehnung wird respektiert','Verständliche Beschwerdewege bestehen']],
['Beteiligung und Beschwerdemöglichkeiten',['Alters- und entwicklungsangemessene Beteiligung','Niedrigschwellige Beschwerden','Rückmeldung an Kinder zu Beschwerden']],
['Medizinische Unterstützungsbedarfe',['Verantwortlichkeiten sind geklärt','Notfallabläufe sind bekannt','Fachliche Absprachen sind dokumentiert']],
['Zusammenarbeit mit Eltern',['Transparente Absprachen','Schutzbedarfe werden gemeinsam reflektiert','Beschwerdewege sind bekannt']],
['Dokumentation und Meldeverfahren',['Dokumentationswege sind festgelegt','Leitung prüft besondere Vorkommnisse','Meldepflichten werden anhand aktueller Vorgaben geprüft']]
];
let state=blank(),step=0;
function blank(){return {facility:{name:'',children:'',groups:'',floors:'',concept:'',conditions:[],other:''},floors:['Erdgeschoss','Obergeschoss'],rooms:[],persons:PERSONS.map(name=>({name,answers:{},notes:'',risk:{}})),themes:THEMES.map(([name])=>({name,measures:[],notes:'',risk:{}})),review:{date:'',responsible:'',measures:'',next:'',signature:''}}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function field(label,path,value='',type='text',extra=''){let control=type==='textarea'?`<textarea data-path="${esc(path)}" ${extra}>${esc(value)}</textarea>`:`<input type="${type}" data-path="${esc(path)}" value="${esc(value)}" ${extra}>`;return `<label class="field">${esc(label)}${control}</label>`}
function select(label,path,value,options){return `<label class="field">${esc(label)}<select data-path="${esc(path)}"><option value="">Bitte auswählen</option>${options.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${value===v?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`}
function check(label,path,checked){return `<label class="check"><input type="checkbox" data-path="${esc(path)}" ${checked?'checked':''}><span>${esc(label)}</span></label>`}
function notice(){return `<aside class="notice important" role="note"><strong>Verbindlicher fachlicher Vorbehalt</strong><p>${esc(DISCLAIMER)}</p></aside>`}
function risk(r,path){r=r||{};let opts=[['low','Gering'],['medium','Mittel'],['high','Hoch']];let sel=(name,label)=>select(label,`${path}.${name}`,r[name]||'',opts);return `<div class="risk"><h3>Vorläufige Risikobewertung <span class="pill ${esc(r.residual||'')}">${esc(r.residual==='low'?'Gering':r.residual==='medium'?'Mittel':r.residual==='high'?'Hoch':'Noch nicht bewertet')}</span></h3><p class="small">Keine automatische Herabstufung durch angekreuzte Maßnahmen. Die Einstufung erfolgt bewusst durch die bearbeitenden Fachkräfte.</p><div class="risk-grid">${sel('potential','Ursprüngliches Gefährdungspotenzial')}${select('Wirksamkeit bestehender Maßnahmen',`${path}.effectiveness`,r.effectiveness||'',[['unknown','Nicht geprüft'],['weak','Unzureichend'],['partial','Teilweise wirksam'],['effective','Nachweislich wirksam']])}${sel('residual','Verbleibendes Restrisiko')}${field('Zusätzlicher Handlungsbedarf',`${path}.action`,r.action||'','textarea')}</div></div>`}
function render(){document.getElementById('nav').innerHTML=STEPS.map((n,i)=>`<button type="button" data-step="${i}" aria-current="${i===step?'step':'false'}">${i}. ${n}</button>`).join('');let html='';if(step===0)html=home();if(step===1)html=facility();if(step===2)html=rooms();if(step===3)html=persons();if(step===4)html=themes();if(step===5)html=results();document.getElementById('app').innerHTML=html;document.querySelectorAll('select[data-path$=".potential"],select[data-path$=".residual"]').forEach(el=>el.classList.add(el.value));}
function home(){return `<section class="card hero"><div class="eyebrow">Pädagogisches Reflexionsinstrument · Version 1</div><h1>Kita-RisikoCheck</h1><p class="tagline">Risiken erkennen. Schutzmaßnahmen reflektieren. Qualität entwickeln.</p><p class="lead">Erarbeiten Sie eine strukturierte, vorläufige Risiko- und Schutzanalyse Ihrer Kindertageseinrichtung – mit besonderem Blick auf inklusive Pädagogik, räumliche Transparenz, Personal und Kinderschutz.</p>${notice()}<div class="notice"><strong>Datenschutz:</strong> Alle Eingaben bleiben ausschließlich während dieser Sitzung im Browser. Es gibt keine Speicherung, kein Tracking und keine Übertragung. Beim Neuladen oder Schließen gehen Ihre Eingaben verloren. Bitte keine personenbezogenen Falldaten eintragen.</div><div class="actions"><button class="btn" data-step="1">Eigene Analyse starten</button><button class="btn secondary" data-action="sample">Musteranalyse laden</button></div><p><a href="https://www.andreas-aguirre.de" target="_blank" rel="noopener">Andreas Aguirre – Coaching für Kitas &amp; Familienzentren</a></p></section>`}
function stephead(title,desc){return `<div class="stephead"><h1>${title}</h1><p>${desc}</p></div>`+(step>=2&&step<=4?notice():'')}
function pager(){return `<div class="actions no-print">${step>0?`<button class="btn secondary" data-step="${step-1}">Zurück</button>`:''}${step<5?`<button class="btn" data-step="${step+1}">Weiter</button>`:''}</div>`}
function facility(){let f=state.facility;return stephead('1 · Angaben zur Einrichtung','Bitte nur allgemeine Strukturdaten eintragen, keine personenbezogenen Falldaten.')+`<section class="card"><div class="grid">${field('Name der Einrichtung (optional)','facility.name',f.name)}${field('Anzahl der Kinder','facility.children',f.children,'number','min="0"')}${field('Anzahl der Gruppen','facility.groups',f.groups,'number','min="0"')}${field('Anzahl der Etagen','facility.floors',f.floors,'number','min="1"')}${select('Pädagogisches Konzept','facility.concept',f.concept,['Offen','Teiloffen','Gruppenbezogen','Sonstiges'])}<div class="full"><h3>Besondere Rahmenbedingungen</h3>${['Inklusive Betreuung','Basisleistung I','Familienzentrum'].map(v=>check(v,`facility.conditions|${v}`,f.conditions.includes(v))).join('')}</div><div class="full">${field('Weitere Rahmenbedingungen (ohne Falldaten)','facility.other',f.other,'textarea')}</div></div></section>`+pager()}
function newRoom(type='Gruppenraum',floor='Erdgeschoss'){return {name:'',floor,type,visibility:'',use:'',oneToOne:'',hazards:'',protections:'',notes:'',risk:{}}}
function rooms(){return stephead('2 · Räume und Etagen','Fügen Sie beliebig viele Räume hinzu und beurteilen Sie jede Nutzungssituation einzeln.')+`<section class="card"><div class="toolbar"><h2>Etagen</h2><button class="btn secondary" data-action="floor">+ Etage hinzufügen</button></div><div class="grid">${state.floors.map((v,i)=>field(`Etage ${i+1}`,`floors.${i}`,v)).join('')}</div><p class="small">Etagenbezeichnungen können angepasst werden. Bereits zugeordnete Räume behalten ihre bisherige Etagenbezeichnung; bei Bedarf bitte neu auswählen.</p></section><section class="card"><div class="toolbar"><h2>Räume (${state.rooms.length})</h2><button class="btn" data-action="room">+ Raum hinzufügen</button></div><div class="grid">${select('Raumvorlage für neuen Raum','_roomTemplate',window.roomTemplate||'Gruppenraum',ROOM_TYPES)}${select('Etage für neuen Raum','_roomFloor',window.roomFloor||state.floors[0],state.floors)}</div></section>${state.rooms.map((r,i)=>`<section class="card"><div class="toolbar"><h2>Raum ${i+1}: ${esc(r.name||r.type)}</h2><button class="btn danger" data-action="deleteRoom" data-index="${i}">Entfernen</button></div><div class="grid">${field('Raumbezeichnung',`rooms.${i}.name`,r.name)}${select('Art der Nutzung',`rooms.${i}.type`,r.type,ROOM_TYPES)}${select('Etage',`rooms.${i}.floor`,r.floor,state.floors)}${select('Einsehbarkeit',`rooms.${i}.visibility`,r.visibility,['Vollständig einsehbar','Teilweise einsehbar','Nicht einsehbar'])}${select('Nutzung',`rooms.${i}.use`,r.use,['Kinder allein','Mit pädagogischen Fachkräften','Mit externen Personen','Wechselnde Nutzung'])}${select('Eins-zu-eins-Situationen möglich?',`rooms.${i}.oneToOne`,r.oneToOne,['Ja','Nein','Unklar'])}${field('Mögliche Gefährdungen',`rooms.${i}.hazards`,r.hazards,'textarea','class="full"')}${field('Bestehende Schutzmaßnahmen (nur tatsächlich umgesetzte)',`rooms.${i}.protections`,r.protections,'textarea')}${field('Eigene Kommentare',`rooms.${i}.notes`,r.notes,'textarea')}</div>${risk(r.risk,`rooms.${i}.risk`)}</section>`).join('')}${state.rooms.length?'':'<p class="notice">Noch keine Räume angelegt. Beginnen Sie mit „Raum hinzufügen“.</p>'}`+pager()}
function persons(){return stephead('3 · Personelle Risiken','Bewerten Sie die einzelnen Personengruppen unabhängig voneinander. Häkchen kennzeichnen tatsächlich bestehende Regelungen.')+state.persons.map((p,i)=>`<section class="card"><h2>${esc(p.name)}</h2><div class="checks">${PERSON_QUESTIONS.map((q,j)=>check(q,`persons.${i}.answers|${j}`,!!p.answers[j])).join('')}</div>${field('Beobachtungen, Regelungslücken und Hinweise',`persons.${i}.notes`,p.notes,'textarea')}${risk(p.risk,`persons.${i}.risk`)}</section>`).join('')+pager()}
function themes(){return stephead('4 · Pädagogische und inklusive Risikobereiche','Kreuzen Sie ausschließlich nachweislich umgesetzte Schutzmaßnahmen an. Nicht ausgewählte Maßnahmen werden nicht als bestehend ausgegeben.')+THEMES.map(([name,ms],i)=>{let t=state.themes[i];return `<section class="card"><h2>${i+1}. ${esc(name)}</h2>${i===8?'<div class="notice important"><strong>Besonderer rechtlicher Hinweis:</strong> Körperliches Festhalten ist nicht pauschal zulässig. Mildere Mittel haben Vorrang. Rechtliche Voraussetzungen, Erforderlichkeit und Verhältnismäßigkeit sowie gegebenenfalls Meldepflichten sind für jeden Einzelfall zu prüfen. Keine Anwendung als Strafe oder zur Durchsetzung von Gehorsam.</div>':''}<h3>Bestehende Schutzmaßnahmen</h3><div class="checks">${ms.map((m,j)=>check(m,`themes.${i}.measures|${j}`,t.measures.includes(j))).join('')}</div>${field('Weitere tatsächlich bestehende Maßnahmen, Beobachtungen und Verbesserungsbedarf',`themes.${i}.notes`,t.notes,'textarea')}${risk(t.risk,`themes.${i}.risk`)}</section>`}).join('')+pager()}
function results(){let doc=generate();return stephead('5 · Dokument erstellen','Der Text wird lokal anhand Ihrer Eingaben aus regelbasierten Formulierungen zusammengestellt – ohne KI oder Server.')+notice()+`<section class="card no-print"><h2>Angaben für die Dokumentation</h2><div class="grid">${field('Datum / Stand','review.date',state.review.date,'date')}${field('Verantwortliche / Beteiligte','review.responsible',state.review.responsible)}${field('Vereinbarte übergreifende Maßnahmen','review.measures',state.review.measures,'textarea')}${field('Nächster Überprüfungstermin','review.next',state.review.next,'date')}${field('Unterschrift / Freigabe','review.signature',state.review.signature)}</div><p class="small">Änderungen aktualisieren den Entwurf unmittelbar. Vor dem Export bitte fachlich prüfen.</p></section><div class="actions no-print"><button class="btn" data-action="copy">Vollständig kopieren</button><button class="btn secondary" data-action="txt">Als .txt herunterladen</button><button class="btn secondary" data-action="print">Drucken / als PDF speichern</button></div><p id="feedback" class="status no-print" role="status" aria-live="polite"></p><div id="printArea"><div class="result" id="resultText">${esc(doc)}</div></div>`+pager()}
function getPath(path){return path.split('.').reduce((o,k)=>o?.[k],state)}
function setPath(path,val){let parts=path.split('.'),obj=state;for(let i=0;i<parts.length-1;i++)obj=obj[parts[i]];obj[parts.at(-1)]=val}
function changed(el){let p=el.dataset.path;if(!p)return;if(p==='_roomTemplate'){window.roomTemplate=el.value;return}if(p==='_roomFloor'){window.roomFloor=el.value;return}if(p.includes('|')){let [base,item]=p.split('|'),v=getPath(base);if(Array.isArray(v)){let n=Number(item);if(el.checked&&!v.includes(n))v.push(n);if(!el.checked)v.splice(v.indexOf(n),1)}else{v[item]=el.checked}return}setPath(p,el.value);if(p.endsWith('.residual')){let box=el.closest('.risk');let badge=box?.querySelector('.pill');if(badge){badge.className='pill '+el.value;badge.textContent=riskLabel(el.value)} }if(el.tagName==='SELECT'&&p.includes('.risk.')){el.classList.remove('low','medium','high');el.classList.add(el.value)}if(step===5){let out=document.getElementById('resultText');if(out)out.textContent=generate()}}
function riskLabel(v){return ({low:'Gering',medium:'Mittel',high:'Hoch'})[v]||'Noch nicht bewertet'}
function sentence(s){s=String(s||'').trim();return s?s.replace(/[.;\s]+$/,'')+'.':''}
function riskText(r){r=r||{};let a=[];a.push(`Das ursprüngliche Gefährdungspotenzial ist ${r.potential?'vorläufig als '+riskLabel(r.potential).toLowerCase()+' eingeschätzt':'noch nicht bewertet'}.`);let e=({unknown:'noch nicht geprüft',weak:'als unzureichend beurteilt',partial:'als teilweise wirksam beurteilt',effective:'als nachweislich wirksam beurteilt'})[r.effectiveness];a.push(`Die Wirksamkeit der Schutzmaßnahmen ist ${e||'noch nicht bewertet'}.`);a.push(`Das verbleibende Restrisiko ist ${r.residual?'vorläufig als '+riskLabel(r.residual).toLowerCase()+' eingeschätzt':'noch nicht bewertet'}.`);if(r.action?.trim())a.push('Zusätzlicher Handlungsbedarf: '+sentence(r.action));return a.join(' ')}
function para(s){return s+'\n\n'}
function generate(){let f=state.facility;let lines=[];const add=(h,t)=>lines.push(h+'\n'+t.trim()+'\n');let cond=f.conditions.length?f.conditions.join(', '):'nicht angegeben';add('RISIKO- UND SCHUTZANALYSE DER KINDERTAGESEINRICHTUNG','Arbeitsentwurf · Kita-RisikoCheck · Andreas Aguirre – Coaching für Kitas & Familienzentren\n\nVERBINDLICHER FACHLICHER VORBEHALT\n'+DISCLAIMER+'\n\nDatenschutz: Dieser Entwurf wurde ausschließlich lokal im Browser erzeugt.');add('1. Zielsetzung und Grundhaltung','Die vorliegende Risiko- und Schutzanalyse unterstützt die strukturierte Auseinandersetzung mit möglichen Gefährdungen im pädagogischen Alltag. Schutz, Beteiligung, Selbstbestimmung und Inklusion sind dabei gemeinsam zu betrachten. Pädagogisch notwendige Freiräume sollen nicht pauschal eingeschränkt, sondern situationsangemessen gestaltet werden. Die Bewertung erfolgt nicht anhand einzelner Kinder oder Diagnosen, sondern anhand der jeweiligen Bedingungen und Abläufe.');let info=[`Einrichtung: ${f.name||'nicht angegeben'}.`,`Kinderzahl: ${f.children||'nicht angegeben'}.`,`Gruppen: ${f.groups||'nicht angegeben'}.`,`Etagen: ${f.floors||'nicht angegeben'}.`,`Konzept: ${f.concept||'nicht angegeben'}.`,`Besondere Rahmenbedingungen: ${cond}.`];if(f.other.trim())info.push('Weitere Angaben: '+sentence(f.other));add('2. Angaben zur Einrichtung',info.join(' '));let rs=state.rooms.length?state.rooms.map((r,i)=>{let s=`${i+1}. ${r.name||r.type||'Raum ohne Bezeichnung'} (${r.floor||'Etage nicht angegeben'}, Nutzung: ${r.type||'nicht angegeben'}).`;s+=` Einsehbarkeit: ${r.visibility||'nicht angegeben'}; Nutzungssituation: ${r.use||'nicht angegeben'}; Eins-zu-eins-Situationen: ${r.oneToOne||'nicht angegeben'}.`;if(r.hazards.trim())s+=' Als mögliche Gefährdungen wurden benannt: '+sentence(r.hazards);if(r.protections.trim())s+=' Als bestehende Schutzmaßnahmen wurden angegeben: '+sentence(r.protections);if(r.notes.trim())s+=' Ergänzende Beobachtungen: '+sentence(r.notes);return s+' '+riskText(r.risk)}).join('\n\n'):'Zu einzelnen Räumen wurden noch keine Angaben erfasst; eine räumliche Risikobewertung steht aus.';add('3. Räumliche Risikoanalyse',rs);let ps=state.persons.map(p=>{let active=Object.keys(p.answers).filter(k=>p.answers[k]).map(k=>PERSON_QUESTIONS[Number(k)]);let text=`${p.name}: `+(active.length?'Als bestehende Regelungen wurden angegeben: '+active.join('; ')+'. ':'Es wurden noch keine bestehenden Regelungen bestätigt. ');if(p.notes.trim())text+='Ergänzende Hinweise: '+sentence(p.notes)+' ';return text+riskText(p.risk)}).join('\n\n');add('4. Personelle Risikoanalyse',ps);let ts=state.themes.map((t,i)=>{let ms=t.measures.map(j=>THEMES[i][1][j]).filter(Boolean);let text=`${t.name}: `+(ms.length?'Als bestehende Schutzmaßnahmen wurden angegeben: '+ms.join('; ')+'. ':'Es wurden noch keine Schutzmaßnahmen bestätigt. ');if(t.notes.trim())text+='Weitere Angaben: '+sentence(t.notes)+' ';return text+riskText(t.risk)}).join('\n\n');add('5. Pädagogische Risikobereiche',ts);let incl=state.themes.filter((t,i)=>[2,4,5,11,12,14].includes(i)).map(t=>t.name);add('6. Inklusion und besondere Schutzbedarfe',`Besondere Aufmerksamkeit gilt möglichen Abhängigkeiten, Kommunikationsbarrieren und eingeschränkten Beschwerdemöglichkeiten. Die Bereiche ${incl.join(', ')} wurden als eigene Prüffelder vorgesehen. Die Einrichtung hat folgende Rahmenbedingungen angegeben: ${cond}. Aus diesen Angaben allein lassen sich weder individuelle Schutzbedarfe noch das Vorhandensein wirksamer Schutzmaßnahmen ableiten.`);let protections=[];state.rooms.forEach(r=>{if(r.protections.trim())protections.push(`${r.name||r.type}: ${sentence(r.protections)}`)});state.persons.forEach(p=>{let a=Object.keys(p.answers).filter(k=>p.answers[k]).map(k=>PERSON_QUESTIONS[Number(k)]);if(a.length)protections.push(`${p.name}: ${a.join('; ')}.`)});state.themes.forEach((t,i)=>{let a=t.measures.map(j=>THEMES[i][1][j]).filter(Boolean);if(a.length)protections.push(`${t.name}: ${a.join('; ')}.`)});add('7. Bestehende Schutzmaßnahmen',protections.length?'Die folgenden Schutzmaßnahmen und Regelungen wurden von den Bearbeitenden ausdrücklich als vorhanden angegeben. Ihre Wirksamkeit ist unabhängig davon zu überprüfen:\n\n'+protections.join('\n'):'Bislang wurden keine bestehenden Schutzmaßnahmen ausdrücklich dokumentiert. Daraus folgt nicht, dass keine vorhanden sind; die Erhebung ist zu ergänzen.');let all=[...state.rooms.map(r=>['Raum: '+(r.name||r.type),r.risk]),...state.persons.map(p=>[p.name,p.risk]),...state.themes.map(t=>[t.name,t.risk])];let rated=all.filter(x=>x[1]?.residual),unrated=all.length-rated.length;let ratings=rated.map(([n,r])=>`${n}: ${riskLabel(r.residual)}`).join('\n');add('8. Vorläufige Risikobewertung',`Von ${all.length} betrachteten Bereichen wurden ${rated.length} hinsichtlich des verbleibenden Restrisikos eingestuft; ${unrated} sind noch nicht bewertet. Die Angaben sind keine automatische Gesamtbewertung und keine Feststellung der rechtlichen Konformität.\n\n${ratings||'Noch keine Restrisiken bewertet.'}`);let actions=all.filter(x=>x[1]?.action?.trim()).map(([n,r])=>`${n}: ${sentence(r.action)}`);if(state.review.measures.trim())actions.push('Übergreifende Maßnahmen: '+sentence(state.review.measures));add('9. Erkannter Handlungsbedarf',actions.length?'Als zusätzliche Handlungsbedarfe wurden festgehalten:\n\n'+actions.join('\n'):'Es wurden noch keine konkreten zusätzlichen Maßnahmen dokumentiert. Dies bedeutet nicht, dass kein Handlungsbedarf besteht.');let docs=state.themes[16],physical=state.themes[8];add('10. Dokumentation und Meldeverfahren',`Dokumentation, interne Informationswege und die Prüfung besonderer Meldepflichten sind für die Einrichtung verbindlich fachlich zu klären. Nicht jeder Vorfall ist automatisch meldepflichtig. Die Leitung hat die einschlägigen gesetzlichen und landesrechtlichen Vorgaben sowie die Zuständigkeit des Landesjugendamts beziehungsweise Landschaftsverbands im Einzelfall zu prüfen.\n\n${docs.measures.length?'Als bereits bestehend angegebene Regelungen: '+docs.measures.map(j=>THEMES[16][1][j]).join('; ')+'.':'Für diesen Themenbereich wurden noch keine Schutzmaßnahmen bestätigt.'}\n\nBei körperlichen Interventionen gilt: Körperliches Festhalten ist nicht pauschal zulässig; mildere Mittel haben Vorrang. Rechtliche Voraussetzungen, Verhältnismäßigkeit, Dokumentation, Nachbereitung und mögliche Meldepflichten sind einzelfallbezogen zu prüfen. ${physical.measures.length?'Als bestehend angegeben: '+physical.measures.map(j=>THEMES[8][1][j]).join('; ')+'.':'Hierzu wurden noch keine Maßnahmen bestätigt.'}`);add('11. Überprüfung und Weiterentwicklung',`Die Analyse ist insbesondere nach besonderen Vorkommnissen, Beschwerden sowie räumlichen, personellen oder konzeptionellen Veränderungen und darüber hinaus regelmäßig gemeinsam zu überprüfen.\n\nStand / Datum: ${state.review.date||'________________'}\nVerantwortliche / Beteiligte: ${state.review.responsible||'________________'}\nVereinbarte Maßnahmen: ${state.review.measures||'________________'}\nNächster Überprüfungstermin: ${state.review.next||'________________'}\nUnterschrift / Freigabe: ${state.review.signature||'________________'}`);add('12. Abschließende fachliche Einordnung',`Dieser Text ist ein lokal und regelbasiert erzeugter Arbeitsentwurf auf Grundlage der eingegebenen Angaben. Eine fachliche Gesamteinschätzung der Sicherheit der Einrichtung oder die Bestätigung gesetzlicher Anforderungen ist damit ausdrücklich nicht verbunden. Offene Angaben, die tatsächliche Umsetzung und Wirksamkeit bestehender Schutzmaßnahmen sowie die Priorisierung weiterer Schritte sind im Team und mit der Leitung zu prüfen.\n\n${DISCLAIMER}\n\nAndreas Aguirre – Coaching für Kitas & Familienzentren\nhttps://www.andreas-aguirre.de`);return lines.join('\n')}
function sample(){state=blank();state.facility={name:'Fiktive inklusive Kita – anonymisiertes Muster',children:'114',groups:'6',floors:'2',concept:'Teiloffen',conditions:['Inklusive Betreuung','Basisleistung I','Familienzentrum'],other:'Vier Gruppen im Erdgeschoss, zwei Gruppen im Obergeschoss; ergänzende Nebenräume.'};state.rooms=[['Gruppenraum EG mit Glastür','Erdgeschoss','Gruppenraum','Vollständig einsehbar','Mit pädagogischen Fachkräften','Ja','Unbeobachtete Einzelmomente bei wechselnder Nutzung.','Glastüren ermöglichen Einblick; gruppenübergreifende Absprachen.','medium','low'],['Nebenraum OG','Obergeschoss','Nebenraum','Teilweise einsehbar','Kinder allein','Ja','Konflikte und Grenzverletzungen können verzögert wahrgenommen werden.','Absprachen zu Aufenthaltsorten; situationsangepasste Aufsicht.','medium','medium'],['Pflegebereich EG','Erdgeschoss','Pflegebereich','Nicht einsehbar','Mit pädagogischen Fachkräften','Ja','Abhängigkeit und erhöhte Schutzbedürftigkeit in intimen Situationen.','Keine abgeschlossenen Türen; Ankündigung der Pflege; Wahrung der Intimsphäre.','high','medium'],['Therapieraum OG','Obergeschoss','Therapieraum','Teilweise einsehbar','Mit externen Personen','Ja','Externe Einzelsettings ohne ständige unmittelbare Beobachtung.','An- und Abmeldung; dokumentierte Übergaben und Aufenthaltsorte.','high','medium']].map(([name,floor,type,visibility,use,oneToOne,hazards,protections,potential,residual])=>({name,floor,type,visibility,use,oneToOne,hazards,protections,notes:'',risk:{potential,residual,effectiveness:'partial',action:'Wirksamkeit im Team anhand konkreter Abläufe überprüfen.'}}));state.persons[2].answers={0:true,2:true,3:true};state.persons[2].notes='Externe Assistenzkräfte werden eingearbeitet; Zuständigkeiten und Pflegegrenzen sind regelmäßig zu reflektieren.';state.persons[2].risk={potential:'high',residual:'medium',effectiveness:'partial',action:'Handreichung für externe Assistenzkräfte fachlich abstimmen.'};state.persons[3].answers={0:true,3:true,4:true};state.persons[3].risk={potential:'high',residual:'medium',effectiveness:'partial',action:'Übergaberegeln überprüfen.'};for(let [i,indices,potential,residual] of [[0,[0,1,2], 'medium','medium'],[2,[0,1,2,3],'high','medium'],[4,[0,1,2],'high','medium'],[5,[0,1,2],'high','medium'],[6,[0,1,2],'high','medium'],[7,[0,1,2],'high','medium'],[8,[0,1,2,3,4],'high','medium'],[9,[0,1],'medium','medium'],[16,[0,1,2],'high','medium']]){state.themes[i].measures=indices;state.themes[i].risk={potential,residual,effectiveness:'partial',action:'Verfahren und tatsächliche Umsetzung gemeinsam überprüfen.'}}state.themes[8].notes='Im fiktiven Beispiel werden körperliche Interventionen schriftlich dokumentiert. Besondere Meldepflichten gegenüber dem zuständigen Landesjugendamt bzw. Landschaftsverband und gegebenenfalls im Zusammenhang mit Basisleistung I werden einzelfallbezogen geprüft.';state.review.measures='Schutzstandards für Einzelsettings und externe Assistenz weiterentwickeln.';step=1;render();window.scrollTo(0,0)}
document.addEventListener('input',e=>{if(e.target.matches('[data-path]'))changed(e.target)});document.addEventListener('change',e=>{if(e.target.matches('[data-path]'))changed(e.target)});document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.step!==undefined){step=Number(b.dataset.step);render();window.scrollTo(0,0);return}let action=b.dataset.action;if(action==='sample'){if(state.rooms.length&&!confirm('Die bisherigen Eingaben werden durch das fiktive Muster ersetzt. Fortfahren?'))return;sample()}if(action==='floor'){state.floors.push(`Etage ${state.floors.length+1}`);render()}if(action==='room'){state.rooms.push(newRoom(window.roomTemplate||'Gruppenraum',window.roomFloor||state.floors[0]));render()}if(action==='deleteRoom'){if(confirm('Diesen Raum und seine Angaben entfernen?')){state.rooms.splice(Number(b.dataset.index),1);render()}}if(action==='copy'){try{await navigator.clipboard.writeText(generate());document.getElementById('feedback').textContent='Text vollständig kopiert.'}catch(err){let ta=document.createElement('textarea');ta.value=generate();document.body.append(ta);ta.select();let ok=document.execCommand('copy');ta.remove();document.getElementById('feedback').textContent=ok?'Text kopiert.':'Kopieren nicht möglich. Bitte Text im Ergebnis markieren.'}}if(action==='txt'){let blob=new Blob(['\ufeff'+generate()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Kita-RisikoCheck-Risikoanalyse.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(action==='print')window.print()});
